server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # add_header is not inherited into locations that define their own, so
    # the shared security headers are included in each location.
    # Vite fingerprints files in /assets, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
