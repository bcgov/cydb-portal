kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-traffic-from-gateway-to-cydb-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cydb-portal
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: prod
              name: {{ .Values.aps.namespace }}
